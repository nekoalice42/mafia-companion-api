name: Build, publish and deploy images

on:
  push:
    branches:
      - main
      - production
    paths:
      - '.deploy/docker/compose.yaml.d/*'
      - '.github/workflows/*'
      - 'apiContract/**'
      - 'cleaner/**'
      - 'dao/**'
      - 'dto/**'
      - 'migrations/**'
      - 'module-templates/**'
      - 'server/**'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'kotlin'
      - 'libs.versions.toml'
      - 'project.yaml'
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy-staging:
    if: github.ref_name == 'main' || inputs.environment == 'staging'
    uses: ./.github/workflows/build-publish-deploy-module.yaml
    secrets: inherit
    with:
      checkout-ref: main
      environment: staging
      environment-url: https://stage.api.mafia.nekoalice.me
      deployment-tag: dev
      project-name: mafia-companion-api-stage
      compose-traefik-dropin-file: traefik-stage.yaml

  build-deploy-production:
    if: github.ref_name == 'production' || inputs.environment == 'production'
    uses: ./.github/workflows/build-publish-deploy-module.yaml
    secrets: inherit
    with:
      checkout-ref: production
      environment: production
      environment-url: https://api.mafia.nekoalice.me
      deployment-tag: latest
      project-name: mafia-companion-api
      compose-traefik-dropin-file: traefik.yaml
